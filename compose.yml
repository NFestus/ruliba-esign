# Production-style stack: one server, Docker Compose, Caddy handling HTTPS itself.
# (Deploying with Dokploy instead? Use compose.dokploy.yml; keep the two files in step.)
#   cp .env.example .env   # then fill in every value (docs/deployment.md)
#   docker compose build
#   docker compose run --rm seed     # first install only
#   docker compose up -d             # runs the database migrations first, every time
# Data lives in named volumes; see docs/deployment.md for backups.

name: ruliba-esign

x-api-env: &api-env
  NODE_ENV: production
  APP_URL: https://${DOMAIN}
  DATABASE_URL: postgresql://esign_app:${DB_APP_PASSWORD}@postgres:5432/esign
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  TRUST_PROXY: 1
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_MFA_SECRET: ${JWT_MFA_SECRET}
  JWT_SIGN_SECRET: ${JWT_SIGN_SECRET}
  MASTER_KEY: ${MASTER_KEY}
  STORAGE_DIR: /data/files
  CLAMAV_HOST: clamav
  CONVERTER: gotenberg
  GOTENBERG_URL: http://gotenberg:3000
  EMAIL_TRANSPORT: ${EMAIL_TRANSPORT}
  EMAIL_FROM: ${EMAIL_FROM}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
  GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
  GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
  GRAPH_SENDER: ${GRAPH_SENDER:-sign@ruliba.com}
  AUDIT_ANCHOR_EMAIL: ${AUDIT_ANCHOR_EMAIL:-}
  # Email domains senders may use when adding a colleague as an internal signer (e.g. ruliba.com). Empty = any.
  INTERNAL_EMAIL_DOMAINS: ${INTERNAL_EMAIL_DOMAINS:-}
  # Two-step sign-in by text message. "console" = SMS not offered in production.
  SMS_TRANSPORT: ${SMS_TRANSPORT:-console}
  AT_USERNAME: ${AT_USERNAME:-}
  AT_API_KEY: ${AT_API_KEY:-}
  AT_SENDER_ID: ${AT_SENDER_ID:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM: ${TWILIO_FROM:-}

services:
  caddy:
    build: { context: ., target: web }
    image: ruliba-esign-web:${VERSION:-latest}
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-it@ruliba.com}
      TLS_MODE: ${TLS_MODE:-}
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: { api: { condition: service_healthy } }
    networks: [edge, internal]

  api:
    build: { context: ., target: api }
    image: ruliba-esign-api:${VERSION:-latest}
    restart: unless-stopped
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clamav: { condition: service_started }
      gotenberg: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    volumes: [files_data:/data/files]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    networks: [internal]

  worker:
    # Same image as the API. The build entry stops Compose trying to download it from Docker Hub.
    build: { context: ., target: api }
    image: ruliba-esign-api:${VERSION:-latest}
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck: { disable: true }
    volumes: [files_data:/data/files]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    networks: [internal, egress]

  # Runs the database migrations on every `up`, before the API and worker start, then exits.
  # Runs as the table owner, which the app itself never uses.
  migrate:
    build: { context: ., target: api }
    image: ruliba-esign-api:${VERSION:-latest}
    restart: 'no'
    command: ['node', 'dist/migrate.js']
    environment:
      MIGRATION_DATABASE_URL: postgresql://esign_owner:${DB_OWNER_PASSWORD}@postgres:5432/esign
    depends_on: { postgres: { condition: service_healthy } }
    networks: [internal]

  # One-off: `docker compose run --rm seed` (departments, document types, first admin). Safe to repeat.
  seed:
    build: { context: ., target: api }
    image: ruliba-esign-api:${VERSION:-latest}
    profiles: [tools]
    command: ['node', 'dist/seed.js']
    environment:
      MIGRATION_DATABASE_URL: postgresql://esign_owner:${DB_OWNER_PASSWORD}@postgres:5432/esign
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    depends_on: { postgres: { condition: service_healthy } }
    networks: [internal]

  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: esign
      POSTGRES_USER: esign_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      TZ: Africa/Kigali
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U esign_owner -d esign']
      interval: 10s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes: [redis_data:/data]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      retries: 10
    environment: { REDIS_PASSWORD: '${REDIS_PASSWORD}' }
    networks: [internal]

  # Word to PDF, in its own container with no network route out.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ['gotenberg', '--chromium-disable-javascript=true', '--api-timeout=60s']
    networks: [internal]

  # Virus scanner. Needs to reach the internet for signature updates.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes: [clamav_db:/var/lib/clamav]
    networks: [internal, egress]

networks:
  edge: {}
  # No route to the internet: database, Redis, files and converters cannot reach out.
  internal: { internal: true }
  # Only the worker (email) and ClamAV (signature updates) may reach out.
  egress: {}

volumes:
  pg_data: {}
  redis_data: {}
  files_data: {} # encrypted document files
  clamav_db: {}
  caddy_data: {}
  caddy_config: {}
